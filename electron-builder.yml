# ── ONE CODEBASE, THREE INSTALLERS ──────────────────────────────────────────
#
# This file is the SHARED base. It never builds anything on its own — every
# build passes one of the configs in build-config/ with `--config`, and that
# file `extends` this one.
#
#   npm run dist:backoffice   →  Odyssey Backoffice
#   npm run dist:pos          →  Odyssey POS
#   npm run dist:database     →  Odyssey Database Setup
#   npm run dist              →  all three
#
# ── WHY THE APP SPLITS IN TWO ───────────────────────────────────────────────
#
# There are two independent questions, and only ONE of them belongs in the
# control panel:
#
#   · Where does the data live?  cloud / local / hybrid  → control panel, and
#     the same build serves all three. A franchise must never be handed a
#     different download because of it.
#   · What is this machine FOR?  back office / till      → two builds.
#
# The second cannot be a runtime setting. A till must open straight to the
# clerk PIN with no admin login reachable at all, and if one build could be
# either then the back office is present on the machine and merely hidden —
# and a manager who knows a URL can reach a hidden thing. Two builds means it
# is not there to reach.
#
# That is a PRODUCT boundary, not a security one. The real boundary stays where
# it already is: actorForModule / requireModuleCapability on every action.
#
# ── WHY THE DATABASE SPLITS OUT ─────────────────────────────────────────────
#
# MariaDB is ~200MB of third-party binaries on their own release cadence; the
# app ships far more often. Bundled together, every app update re-downloads a
# database that did not change. Apart, app updates stay small and the database
# installer is a rare, separate thing.
#
# It also means a ten-till restaurant does not put ten copies of a database on
# ten machines that will never run one. Only the machine that HOSTS gets it.
appId: za.co.pointofsale.odysseyai
copyright: Copyright © Point of Sale (Pty) Ltd

# `output` is NOT here. Each build config names its own release/<role> folder,
# because electron-builder calls the update manifest `latest.yml` whatever the
# product is, and three of them in one folder leaves one. See build-config/.
directories:
  buildResources: build

# The Next server runs in-process, so the build output and runtime deps must be
# unpacked next to the asar rather than compiled into it.
#
# ── THE `!node_modules` LINE IS LOAD-BEARING ────────────────────────────────
#
# Listing only `electron/**/*` and `package.json` reads as "the asar holds the
# shell and nothing else". It did not. electron-builder packs the production
# dependency tree into the asar whatever this list says, so every build shipped
# node_modules TWICE — 387MB of it inside app.asar (plus 120MB pulled back out
# into app.asar.unpacked for the native modules), and the whole tree again under
# extraResources at app/node_modules for the Next server.
#
# Both copies were live, which is the part that made it more than waste:
# `require('next')` from main.js resolved inside the asar while the compiled
# server chunks resolved React against app/node_modules. Two trees in one
# process is how a build ends up with two Reacts.
#
# So the asar keeps the shell alone and electron/appModules.js resolves the
# three packages this process needs — next, mysql2, electron-updater — against
# the app directory. That copy has to exist regardless, because Next loads its
# own build from there.
#
# The saving is ~400MB and ~10,000 files off EVERY installer, paid twice over on
# an all-in-one that installs both Back Office and Database Setup.
#
# ── WHAT THE `node_modules/{…}` LINE PUTS BACK, AND WHY ────────────────────
#
# Two packages are the SHELL's, not the app's: electron-updater, which Next has
# never heard of, and mysql2, which main.js and dbSetupBridge.js use to migrate
# a site database before any server is running. `output: 'standalone'` traces
# the NEXT app, so its node_modules carries mysql2 (it is a
# serverExternalPackage) but not electron-updater — and leaning on the app's
# copy for the shell's own needs would make a silent breakage the day Next stops
# tracing it. So the shell brings its own.
#
# 27 packages, 670 files, 4.3MB — and it costs NOTHING at install time, because
# the asar is a single file on disk. That is the whole trick: files in an asar
# are free, files beside it are not.
#
# Regenerate the list by walking `dependencies` from electron-updater and mysql2
# in a hoisted node_modules. It is written out rather than computed so a build
# never silently ships a different set than the one that was reviewed.
files:
  - electron/**/*
  - package.json
  - '!node_modules{,/**/*}'
  - 'node_modules/{argparse,aws-ssl-profiles,builder-util-runtime,debug,denque,electron-updater,fs-extra,generate-function,graceful-fs,iconv-lite,is-property,js-yaml,jsonfile,lazy-val,lodash.escaperegexp,lodash.isequal,long,lru.min,ms,mysql2,named-placeholders,safer-buffer,sax,semver,sql-escaper,tiny-typed-emitter,universalify}/**/*'

extraResources:
  # ── THE BUILD OUTPUT, LESS THE PARTS NOTHING RUNS ─────────────────────────
  #
  # `next dev` and `next build` write into the SAME .next folder, and the dev
  # artefacts are the larger by an order of magnitude: on a machine that has run
  # the desktop dev server, .next/dev reaches 7GB and .next/cache another 700MB,
  # against ~200MB of actual server + static output.
  #
  # `standalone` is dropped here because only ONE part of it is shipped, and it
  # is taken directly below. Leaving it in would ship a second copy of .next.
  #
  # ── AND NOT THE TWO KINDS OF FILE NOTHING READS AT RUNTIME ────────────────
  #
  # Measured on the shipped .next: 8,507 files, 200MB. Of that,
  #
  #   .map       2,881 files  119.2MB   source maps
  #   .nft.json    362 files   31.4MB   file-tracing metadata
  #
  # 3,243 files and 150MB - a third of the file count and three quarters of the
  # bytes - for two things the running app never opens.
  #
  # SOURCE MAPS are not applied by anything here. Node ignores them without
  # --enable-source-maps, and nothing in electron/ or next.config.mjs passes it;
  # the proof is in the field, where a customer's stack trace reads
  # `src_lib_auth_ts_0r2vclv._.js:33:491` rather than a .ts file and line. So
  # they cost 119MB to change nothing about diagnosis.
  #
  # They are also the ORIGINAL TYPESCRIPT, readable with a text editor, on a
  # machine the customer owns. Dropping them is worth doing on that ground
  # alone.
  #
  # .nft.json is what Next writes so that `output: 'standalone'` can work out
  # which modules to copy. It is consumed at BUILD time, by the build that
  # already happened. Shipping it is shipping the workings.
  #
  # Note the other 1,660 .json files are KEPT and must be: build-manifest,
  # app-paths-manifest, server-reference-manifest and friends are read on every
  # request. They are 1.6MB in total, so there is nothing to gain by being
  # clever about them and a broken app to lose.
  - from: .next
    to: app/.next
    filter:
      - '**/*'
      - '!dev{,/**/*}'
      - '!cache{,/**/*}'
      - '!standalone{,/**/*}'
      - '!**/*.map'
      - '!**/*.nft.json'
  # ── THE TRACED DEPENDENCY SET, AND ONLY THAT ──────────────────────────────
  #
  # `output: 'standalone'` in next.config.mjs makes Next work out which modules
  # the server actually loads. Taking its node_modules and nothing else:
  #
  #     before   app/node_modules   33,969 files   468MB
  #     after    app/node_modules    1,338 files    22MB
  #
  # ── WHY ONLY ITS node_modules, AND NOT THE REST OF STANDALONE ─────────────
  #
  # Because the rest of it does not work here, and it fails in a way worth
  # writing down. This app builds with Turbopack, and a standalone build does
  # NOT trace Turbopack's server chunks: .next/standalone/.next/server/chunks
  # came out with 3 files where the real build has 5,030, 3,942 of them under
  # chunks/ssr. The packaged app then prepares cleanly, serves /api/health, and
  # 500s on the first page with
  #
  #     Cannot find module '../chunks/ssr/[turbopack]_runtime.js'
  #
  # Found by making a real request to the packaged build; `prepare()` succeeding
  # proves nothing, and neither does a size diff. So the real .next is shipped
  # above, and standalone is used ONLY for the one thing it gets right — the
  # traced module list, which is derived from those same chunks and is therefore
  # complete for them.
  #
  # If a later Next fixes Turbopack tracing, this collapses back into a single
  # `from: .next/standalone` entry — but verify it by serving a page, not by
  # looking at the folder.
  - from: .next/standalone/node_modules
    to: app/node_modules
  # ── THE SAME GAP AGAIN, INSIDE next ITSELF ────────────────────────────────
  #
  # The trace misses Next's own server runtimes the way it misses the chunks
  # above: app/node_modules/next/dist/compiled/next-server came out with 3 of
  # the 13 .runtime.prod.js files. app-route-turbo.runtime.prod.js is one of
  # the ten missing, so PAGES render and every App Route — /api/health
  # included, which is what this shell waits on — dies with
  #
  #     Cannot find module 'next/dist/compiled/next-server/app-route-turbo.runtime.prod.js'
  #
  # Listed after the entry above so it lands on top of the traced copy rather
  # than being overwritten by it. 4.1MB for all thirteen, so they are shipped
  # whole rather than picked over; the .runtime.dev.js set is 13MB and is only
  # ever loaded by `next dev`, which a packaged build cannot run.
  #
  # Same caveat as above: if a later Next traces these, verify the removal by
  # REQUESTING AN API ROUTE from the packaged build. Nothing about the folder
  # looks wrong when they are missing.
  - from: node_modules/next/dist/compiled/next-server
    to: app/node_modules/next/dist/compiled/next-server
    filter:
      - '**/*.runtime.prod.js'
  # ── NEXT'S OWN INTERNALS, WHICH THE TRACER KEEPS MISSING ──────────────────
  #
  # Three separate "cannot find module" bugs came out of the same hole, each
  # found only after the previous fix looked complete:
  #
  #   .next/server/chunks/ssr/[turbopack]_runtime.js   -> every PAGE 500s
  #   next-server/app-route-turbo.runtime.prod.js      -> every APP ROUTE 500s
  #   next/dist/compiled/webpack/webpack-lib           -> the server will not boot
  #
  # Standalone ships 129 of the 1,155 files under next/dist/compiled. Under
  # Turbopack the trace simply does not see what the server lazily requires, and
  # each round of patching one path has been followed by another path.
  #
  # So this stops guessing and ships the directory, minus the two parts that are
  # genuinely not needed:
  #
  #   next-server   78MB of the 125MB, and the entry above already ships the 13
  #                 .runtime.prod.js files it actually loads - verified against a
  #                 real failure rather than assumed.
  #   next-devtools dev tooling; a packaged production server never opens it.
  #
  # ~1,080 files and ~44MB. Against a 6,855-file package that is a rounding error
  # on install time, which is per-file - and the alternative is discovering the
  # fourth missing module on a customer's counter.
  #
  # scripts/verify-packaged-build.mjs is what catches this class of bug: it
  # copies the payload OUT of the repo before booting it, because in place Node
  # walks up into OdysseyAI/node_modules and resolves modules that were never
  # shipped. All three bugs above passed an in-place check.
  - from: node_modules/next/dist/compiled
    to: app/node_modules/next/dist/compiled
    filter:
      - '**/*'
      - '!next-server{,/**/*}'
      - '!next-devtools{,/**/*}'
  - from: public
    to: app/public
  # ── THE SCHEMA, SO A NEW DATABASE CAN BE GIVEN ONE ────────────────────────
  #
  # Odyssey Database Setup creates an empty database and then has to fill it —
  # 261 files in sql/site, applied once each by electron/siteMigrate.js. Until
  # this entry existed they were not in the package at all, so the wizard would
  # have created a database with no tables in it and reported success.
  #
  # Next to the asar rather than inside it: read once on a machine that will
  # never read them again, and a technician can open the one that failed.
  #
  # Not under app/ — this is the installer's own material, not the Next server's.
  # next.config.mjs excludes sql/ from the file tracer for the same reason: the
  # Next server never reads a migration, only this installer does.
  - from: sql
    to: sql
  # ── A COPY, NOT THE FILE ITSELF ────────────────────────────────────────────
  #
  # Every `from` listed here is added to the app copier's EXCLUDE list — see
  # platformPackager.ts, which feeds extraResources through
  # computeParsedPatterns into `excludePatterns`. That is right for .next, which
  # belongs beside the asar and not inside it.
  #
  # It is fatal for package.json. Naming the real one here removed it from the
  # asar ROOT, where Electron requires it to find `main` — and the build then
  # died on its own sanity check, before ever reaching the installer step.
  #
  # So the Next app dir gets a COPY, written by scripts/make-build-defaults.mjs
  # into the buildResources directory (already excluded from `files`). The real
  # package.json is left unnamed here, and therefore stays in the asar.
  # ── THE RAW-PRINT HELPER ────────────────────────────────────────
  #
  # ~6KB that hands RAW bytes to a Windows print queue, so a USB thermal printer
  # gets a real ESC/POS stream — which is what makes the paper cut and the cash
  # drawer work. electron/printTransports.js spawns it. Node cannot do this on
  # its own and every alternative is worse; the argument is in RawPrint.cs.
  #
  # NOT a native node module: no binding.gyp, no node-gyp, no ABI coupling, so
  # nothing here needs rebuilding when Electron moves.
  #
  # extraResources and NOT `files`, deliberately — this lands OUTSIDE app.asar,
  # and you cannot spawn a path inside an asar. Anyone later "tidying" it into
  # the files list would break raw USB printing with no error at build time.
  #
  # A `from` that does not exist is skipped, so a macOS or Linux build simply
  # omits it and printTransports falls through to `lp -o raw`.
  #
  # Built by `npm run build:rawprint` and COMMITTED, the same way build/icon.ico
  # is: `npm run dist` never regenerates it, because a build that silently
  # rebuilds a binary it then spawns is a build whose output nobody reviewed.
  - from: build/rawprint/odyssey-rawprint.exe
    to: rawprint/odyssey-rawprint.exe
  - from: build/app-package.json
    to: app/package.json
  - from: next.config.mjs
    to: app/next.config.mjs

# ── THE MARKER THAT SAYS WHICH KIND OF INSTALL THIS IS ──────────────────────
#
# resolveInitialBackend() reads `backend.txt` from the directory holding the
# EXECUTABLE — deliberately, because it describes the installer rather than the
# machine, and must therefore survive an upgrade that replaces the app folder.
#
# extraFiles, not extraResources: resources/ is one level down, and the file has
# to sit beside the .exe for that lookup to find it. docs/local-backend.md tells
# a builder to `echo local > build/backend.txt`, and until this entry existed
# nothing carried it into the package — so a local build shipped, silently, as
# a cloud one and pointed every site query at the customer's own machine.
#
# A `from` that does not exist is skipped, so a cloud build simply omits it and
# resolveInitialBackend falls through to its documented default of cloud.
extraFiles:
  - from: build/backend.txt
    to: backend.txt

# ── WHERE UPDATES COME FROM ─────────────────────────────────────────────────
#
# In two places, for two different jobs, and it is worth being clear which is
# which because the split is not obvious.
#
#   build-config/*.yml `publish:`   a LITERAL generic URL per product. Its only
#                                   job is to make electron-builder write a
#                                   truthful app-update.yml into resources/ —
#                                   which electron-updater reads for
#                                   `updaterCacheDirName` even when the feed is
#                                   set at runtime. Never an ${env.X}: those are
#                                   expanded at build time and an unset one is
#                                   FATAL, so a developer building locally would
#                                   get "cannot expand pattern" instead of an
#                                   installer.
#
#   ODYSSEY_UPDATE_URL              the runtime authority. Baked into
#                                   electron/buildDefaults.json by
#                                   scripts/make-build-defaults.mjs and read by
#                                   electron/updater.js, which appends the role
#                                   folder and calls setFeedURL. This is what
#                                   lets one build be pointed at a staging host.
#
# A build made without ODYSSEY_UPDATE_URL still runs and says so in the log; it
# simply cannot update itself, and make-build-defaults warns loudly.
#
# What the build emits either way is what the updater consumes: latest.yml and a
# .blockmap per installer, in release/<role>/. `npm run publish:release` uploads
# them. Upload the .blockmap alongside the .exe or every shop re-downloads the
# whole 130MB installer rather than the parts that changed.

# ── THE ICON, IN ONE PLACE FOR ALL THREE PRODUCTS ──────────────────────────
#
# Named explicitly rather than left to the buildResources convention. Both find
# the same file today, but a silent convention is a bad way to carry branding:
# rename the file or move buildResources and every installer quietly reverts to
# the stock Electron atom, and nothing in the build output says so.
#
# It is a .ico, not the .png, deliberately. electron-builder WILL convert a png,
# and the conversion is a single bitmap scaled to every size — legible at 256px
# and mush at 16px, which is the size Explorer and the taskbar use most.
# scripts/make-icons.mjs builds the real thing from public/logo-icon.png, with
# seven bitmaps in it, and commits the result. Re-run it when the artwork
# changes; a build never runs it.
#
# The NSIS installer and uninstaller inherit this — `installerIcon` and
# `uninstallerIcon` both fall back to the app icon — so there is deliberately no
# second copy of it under `nsis:` to fall out of step.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # ── UNINSTALLING ODYSSEY MUST NEVER TAKE THE SHOP'S DATA WITH IT ──────────
  #
  # This is already the default. It is written down anyway, because the failure
  # it prevents is unrecoverable and the person who would trip it is not being
  # careless: a technician uninstalls Odyssey to install a newer version, which
  # is an entirely ordinary thing to do, and expects to find the shop exactly as
  # they left it.
  #
  # The database does not live under the install directory or in userData — it
  # is in ProgramData\Odyssey\mariadb, written at runtime by mariaService.js,
  # and no uninstaller has ever heard of it. That is the real protection. This
  # flag closes the other door: the one where somebody switches it on to tidy up
  # after a test machine and ships it.
  #
  # There is deliberately NO prompt offering to remove the data either. A
  # question with an irreversible wrong answer, asked of somebody halfway
  # through an update, is a data-loss incident waiting for a distracted
  # afternoon. Removing a shop's database is a separate, deliberate act — see
  # docs/local-backend.md.
  deleteAppDataOnUninstall: false
