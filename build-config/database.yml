# Odyssey Database Setup — MariaDB, and the provisioning that configures it.
#
# Run once, by a technician, on the ONE machine that hosts the shop's database:
# the in-store box on a hybrid site, or the back-office machine on a local one.
# A cloud site never needs it.
#
# It asks for an email and password, authenticates against the control panel,
# reads the site's connection_type, and creates the database and user from the
# credentials the control panel already holds. The technician never learns them.
#
# ── THIS IS THE ONLY ARTIFACT CARRYING vendor/mariadb ───────────────────────
#
# electron-builder skips a `from` that does not exist, so a machine without
# vendor/mariadb populated simply builds an installer with no database in it —
# there is no `optional` flag in a FileSet (the schema rejects unknown keys) and
# none is needed. localDb.isBundled() reports that clearly at runtime rather
# than crashing.
#
# Populate vendor/mariadb from the official portable ZIP — see
# docs/local-backend.md. Deliberately NOT committed: ~200MB of third-party
# binaries with their own release cadence.
extends: ./electron-builder.yml

productName: Odyssey Database Setup

appId: za.co.pointofsale.odyssey.database

# ── WHERE THIS BUILD'S RELEASES LIVE ────────────────────────────────────────
#
# Its OWN output folder, because electron-builder names the update manifest
# `latest.yml` regardless of product. Three builds sharing `release/` meant one
# latest.yml describing whichever installer was cut last — and `npm run dist`
# builds all three, so that was every full build.
#
# `publish` is here rather than in the shared file for the same reason: the
# generic provider needs a URL, and the URL differs per product. It is a
# LITERAL, deliberately — electron-builder expands ${env.X} at build time and
# treats an unset variable as fatal, so an env var here would mean a developer
# building locally gets "cannot expand pattern" instead of an installer.
#
# It is not the authority at runtime. electron/updater.js sets its own feed from
# ODYSSEY_UPDATE_URL, baked into buildDefaults.json, so a build can be pointed
# at a staging host without touching this file. What `publish` is FOR is
# app-update.yml, which electron-builder writes into resources/ and which
# electron-updater reads for `updaterCacheDirName` whatever the feed says.
# Without a publish block that file was generated from the git remote and
# claimed a private GitHub repo — harmless only by accident.
directories:
  output: release/database

publish:
  provider: generic
  url: https://updates.odysseysoftware.co.za/database/

# No spaces. electron-builder writes the SAFE name into latest.yml — spaces
# collapsed to dashes — while writing the file to disk under the name below. A
# `${productName}` with a space in it therefore produced a manifest pointing at
# a filename that does not exist, and every update 404'd on download.
artifactName: Odyssey-Database-Setup-${version}-${arch}.${ext}

extraMetadata:
  odysseyRole: database

  # ── A PACKAGE NAME PER PRODUCT, FOR THE UPDATER'S CACHE ────────────────────
  #
  # electron-updater keeps downloads in %LOCALAPPDATA%\<name>-updater, derived
  # from package.json's `name` — which was `odyssey-ai` in all three builds. A
  # machine running Back Office and POS side by side (explicitly supported, see
  # the shared config) had both writing into one folder, and the first thing
  # either does before downloading is EMPTY it. Each would delete the other's
  # finished download minutes before quit applied it, so neither ever updated
  # and nothing anywhere said why.
  #
  # `productName` is pinned back to the old value because Electron prefers it
  # over `name` when deriving userData — without it this line would move
  # %APPDATA%\odyssey-ai and every shop would lose its machine config.
  # electron/main.js calls app.setName('odyssey-ai') as well; belt and braces on
  # a failure that has no recovery path.
  name: odyssey-database
  productName: odyssey-ai

# ── THE ONE BUILD THAT ASKS FOR ADMINISTRATOR ───────────────────────────────
#
# Registering a Windows service is a machine-level act, and Windows will not let
# a normal user do it. This build installs MariaDB as a service so the shop's
# database starts at boot and outlives whichever app happened to open it — see
# electron/mariaService.js.
#
# So it asks for elevation the moment it launches, rather than getting halfway
# through provisioning and failing on the one step that needed it. That is the
# honest shape for a program that IS an installer.
#
# Deliberately NOT set on the back office or the till. Those only ever connect
# to the service, and an everyday application that demands administrator rights
# to open a shop's stock screen is one somebody will eventually turn off.
win:
  requestedExecutionLevel: requireAdministrator

# ── AND ONLY THE PARTS OF IT A SHOP RUNS ───────────────────────────────────
#
# The official portable ZIP is a DEVELOPER distribution: it carries the debug
# symbols and link libraries you would need to build a C client against it, and
# a shop needs none of them. Measured on the tree this build was cut from,
# 292MB shipped and ~133MB of it could never be executed.
#
# That 133MB was paid three times over on an all-in-one — once in the download,
# once by NSIS writing it to Program Files, and once more by
# mariaService.installBinaries copying the lot into ProgramData.
#
# Filtered here rather than by pruning vendor/mariadb, so that repopulating the
# folder from a newer official ZIP does not quietly put it all back.
#
# ── WHAT IS SAFE TO CUT, AND HOW THAT WAS ESTABLISHED ──────────────────────
#
# The app only ever executes four of these binaries — mariadbd, mariadb,
# mariadb-install-db and mariadb-admin, each with its legacy mysql* alias as a
# fallback. See localDb.js's exe() helpers, which name them all. Nothing in
# electron/, src/ or scripts/ shells out to anything else, which is what makes
# the backup pair below droppable rather than merely unused today.
extraResources:
  - from: vendor/mariadb
    to: mariadb
    filter:
      - '**/*'
      # Debug symbols. 73MB for server.pdb alone — a crash dump from a customer
      # machine is not something this product has ever asked for or could read.
      - '!**/*.pdb'
      # Link-time import libraries, for COMPILING against MariaDB. There is no
      # compiler on a shop counter.
      - '!**/*.lib'
      # C headers, same reason.
      - '!include{,/**/*}'
      # 37MB of physical-backup tooling, in two identically-sized copies under
      # the old and new names. Backups here are logical dumps (scripts/backup.mjs
      # shells out to mysqldump, which stays), and nothing invokes either of
      # these. Restore them the day a backup story actually needs them.
      - '!bin/mariabackup.exe'
      - '!bin/mariadb-backup.exe'
      # The CONNECT engine's MongoDB Java driver. No JVM ships here, and no shop
      # federates a Mongo table from its till.
      - '!share/Mongo*.jar'
